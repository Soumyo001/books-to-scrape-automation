[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py

addopts =
    --browser=chromium
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=test-results
    --html=report.html
    --self-contained-html
    --alluredir=allure-results
    --clean-alluredir

markers =
    smoke: Basic application checks
    regression: Full functional tests