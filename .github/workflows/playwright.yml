
name: Playwright UI Automation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install Allure CLI
        run: npm install --global allure-commandline@2.46.1

      - name: Run tests and capture execution log
        id: run_tests
        run: |
          mkdir -p test-results
          set -o pipefail
          python -m pytest -v 2>&1 | tee pytest.log

      - name: Generate Allure HTML report
        if: always()
        run: |
          if [ -d allure-results ] && \
             find allure-results -type f -name '*-result.json' \
             -print -quit | grep -q .; then
            allure generate allure-results --clean -o allure-report
          else
            echo "No Allure result files found; skipping report generation."
          fi

      - name: Prepare GitHub Pages site
        if: always()
        env:
          TEST_STEP_OUTCOME: ${{ steps.run_tests.outcome }}
        run: |
          mkdir -p site

          if [ -f report.html ]; then
            cp report.html site/report.html
          fi

          if [ -d allure-report ]; then
            cp -R allure-report site/allure-report
          fi

          if [ -f pytest.log ]; then
            cp pytest.log site/pytest.log
          fi

          if [ -d test-results ]; then
            cp -R test-results site/test-results
          fi

          generated_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Books to Scrape - Automation Reports</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                max-width: 850px;
                margin: 40px auto;
                padding: 0 20px;
                line-height: 1.6;
                color: #222;
              }
              h1 { color: #1769aa; }
              li { margin: 12px 0; }
              a { color: #1769aa; }
              .metadata {
                background: #f3f5f7;
                padding: 16px;
                border-radius: 8px;
              }
            </style>
          </head>
          <body>
            <h1>Books to Scrape - Automation Reports</h1>
            <p>Reports generated by the Playwright and Pytest CI pipeline.</p>
            <div class="metadata">
              <p><strong>Pytest step outcome:</strong> ${TEST_STEP_OUTCOME}</p>
              <p><strong>Generated:</strong> ${generated_at}</p>
            </div>
            <h2>Test reports</h2>
            <ul>
          EOF

          if [ -f site/report.html ]; then
            printf '  <li><a href="./report.html">Pytest HTML Report</a></li>\n' >> site/index.html
          else
            printf '  <li>Pytest HTML report was not generated.</li>\n' >> site/index.html
          fi

          if [ -f site/allure-report/index.html ]; then
            printf '  <li><a href="./allure-report/index.html">Allure Report</a></li>\n' >> site/index.html
          else
            printf '  <li>Allure HTML report was not generated.</li>\n' >> site/index.html
          fi

          if [ -f site/pytest.log ]; then
            printf '  <li><a href="./pytest.log">Pytest Execution Log</a></li>\n' >> site/index.html
          fi

          cat >> site/index.html <<'EOF'
            </ul>
            <p>Failure screenshots, videos and traces are included when generated.</p>
          </body>
          </html>
          EOF

      - name: Upload test reports and artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-artifacts
          path: |
            report.html
            pytest.log
            allure-results/
            allure-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: >-
          always() &&
          github.event_name != 'pull_request' &&
          github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Publish Reports to GitHub Pages
    needs: test

    if: >-
      always() &&
      needs.test.result != 'cancelled' &&
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
